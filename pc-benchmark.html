<!DOCTYPE html>
<html lang="pl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ByteTEx PC Benchmark</title>

<style>

body{
font-family:Arial;
background:#111;
color:white;
text-align:center;
padding:30px;
}

.box{
background:#222;
padding:20px;
border-radius:15px;
max-width:600px;
margin:auto;
}

button{
padding:12px 25px;
font-size:18px;
cursor:pointer;
border-radius:10px;
}

.result{
margin-top:20px;
text-align:left;
}

.bar{
height:20px;
background:#333;
border-radius:10px;
overflow:hidden;
}

.progress{
height:100%;
width:0%;
background:#00ff88;
}

</style>

</head>


<body>


<div class="box">

<h1>⚡ ByteTex PC Benchmark</h1>

<p>
Test wydajności przeglądarki i komputera
</p>


<button onclick="startBenchmark()">
▶ Start testu
</button>


<div class="result" id="result">

</div>


</div>



<script>


function startBenchmark(){


let result=document.getElementById("result");


result.innerHTML=`
<p>⏳ Test CPU...</p>
<div class="bar">
<div class="progress" id="cpu"></div>
</div>
`;



let start=performance.now();


let count=0;


while(performance.now()-start < 1000){

count++;

Math.sqrt(count);

}



let cpuScore=Math.min(
100,
Math.floor(count/50000)
);



document.getElementById("cpu").style.width=
cpuScore+"%";



let ram =
navigator.deviceMemory || "Nieznana";



setTimeout(()=>{


result.innerHTML+=`

<h3>📊 Wynik</h3>

<p>
Procesor (JS): ${cpuScore}/100
</p>

<p>
RAM:
${ram} GB
</p>

<p>
Rdzenie CPU:
${navigator.hardwareConcurrency || "brak"}
</p>

<p>
Ekran:
${screen.width}x${screen.height}
</p>

<p>
Przeglądarka:
${navigator.userAgent}
</p>


`;

},1000);


}


</script>


</body>
</html>
