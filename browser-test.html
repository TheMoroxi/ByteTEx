
<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ByteTEx Browser Security Scanner</title>

<style>

body{
    background:#0f1115;
    color:white;
    font-family:Arial, sans-serif;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    text-align:center;
    color:#00ff99;
}

.card{
    background:#181c24;
    border-radius:12px;
    padding:20px;
    margin:15px 0;
    box-shadow:0 0 10px #000;
}

.result{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #333;
}

.ok{
    color:#00ff99;
}

.warn{
    color:#ffaa00;
}

.bad{
    color:#ff4444;
}


.progress{
    width:100%;
    height:25px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    height:100%;
    width:0%;
    background:#00ff99;
    transition:1s;
}


button{

    background:#00ff99;
    border:0;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;

}


button:hover{
    background:#00cc77;
}


.info{

    background:#101318;
    padding:10px;
    border-radius:8px;

}

</style>

</head>


<body>


<div class="container">


<h1>
🛡️ ByteTEx Browser Security Scanner
</h1>


<div class="card">

<h2>Wynik bezpieczeństwa</h2>

<div class="progress">

<div id="scoreBar" class="bar"></div>

</div>

<h3 id="score">
0 / 100
</h3>

</div>



<div class="card">

<button onclick="startScan()">
🚀 Uruchom skanowanie
</button>

</div>



<div class="card">

<h2>Testy przeglądarki</h2>

<div id="results">

<p>
Kliknij skanowanie aby rozpocząć...
</p>

</div>

</div>




<div class="card">

<h2>Informacje urządzenia</h2>

<div id="device" class="info">

Brak danych

</div>

</div>



</div>



<script src="scanner.js"></script>


</body>
</html>
